<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taste of Bali | Web Experience</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--green:#183f35;--coral:#c8755d;--cream:#f8f3ea;--ink:#26342e}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Manrope, sans-serif;color:var(--ink);background:#fff}
.topbar{position:sticky;top:0;z-index:1000;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-bottom:1px solid #e9e5dc}
.nav-wrap{max-width:1440px;margin:auto;min-height:76px;padding:0 4.5%;display:flex;align-items:center;gap:28px}
.brand{font-family:"Bodoni Moda",serif;font-size:25px;line-height:1;color:var(--green);white-space:nowrap;text-decoration:none;letter-spacing:-.5px}
.brand span{color:var(--coral)}
.nav-links{display:flex;align-items:center;gap:clamp(12px,1.8vw,27px);margin-left:auto}
.nav-links button,.more-menu button{border:0;background:none;color:#526159;font:600 11px Manrope,sans-serif;letter-spacing:.45px;text-transform:uppercase;cursor:pointer;padding:10px 0;white-space:nowrap;transition:.2s}
.nav-links button:hover,.nav-links button.active,.more-menu button:hover{color:var(--coral)}
.nav-links button.active{box-shadow:inset 0 -2px var(--coral)}
.book-btn{background:var(--green)!important;color:#fff!important;padding:12px 18px!important;border-radius:3px;letter-spacing:.7px!important}
.book-btn:hover{background:var(--coral)!important}
.more{position:relative}
.more-toggle{display:flex;align-items:center;gap:5px}
.more-menu{display:none;position:absolute;right:0;top:100%;min-width:190px;padding:9px 16px;background:white;border:1px solid #eee7dc;box-shadow:0 12px 30px #183f351a;border-radius:4px}
.more.open .more-menu{display:grid}
.more-menu button{text-align:left;padding:11px 0;border-bottom:1px solid #f1eee8}
.more-menu button:last-child{border:0}
.mobile-toggle{display:none;margin-left:auto;border:1px solid #e7e1d7;background:white;color:var(--green);border-radius:3px;padding:9px 11px;font-size:18px;cursor:pointer}
main{min-height:70vh}
#pageFrame{display:block;width:100%;height:calc(100vh - 76px);min-height:650px;border:0;background:#fff}
#footerFrame{display:block;width:100%;height:340px;border:0;background:var(--green)}
.loading{padding:60px 20px;text-align:center;color:#68756e}
@media(max-width:1000px){
 .nav-wrap{gap:18px;padding:0 3%}.brand{font-size:22px}.nav-links{gap:12px}
 .nav-links button{font-size:10px}
}
@media(max-width:760px){
 .nav-wrap{min-height:68px;padding:0 5%}.mobile-toggle{display:block}
 .nav-links{display:none;position:absolute;left:0;right:0;top:68px;background:white;padding:12px 5% 20px;border-bottom:1px solid #e9e5dc;box-shadow:0 12px 22px #183f3510;align-items:stretch;gap:0;flex-direction:column}
 .nav-links.show{display:flex}
 .nav-links button{text-align:left;padding:13px 0;font-size:11px;border-bottom:1px solid #f2eee8}
 .nav-links button.active{box-shadow:none;color:var(--coral)}
 .book-btn{text-align:center!important;margin-top:10px;border:0!important}
 .more-menu{position:static;box-shadow:none;border:0;border-radius:0;padding:0 12px;background:#faf8f3}
 .more-menu button{width:100%}
 #pageFrame{height:calc(100vh - 68px);min-height:600px}
 #footerFrame{height:440px}
}
</style>
</head>
<body>
<header class="topbar">
 <div class="nav-wrap">
  <a href="#" class="brand" id="brandHome">Taste <span>of</span> Bali</a>
  <button class="mobile-toggle" id="mobileToggle" aria-label="Open navigation">☰</button>
  <nav class="nav-links" id="navLinks" aria-label="Main navigation">
   <button data-page="home" class="active">Home</button>
   <button data-page="about">About</button>
   <button data-page="classes">Classes</button>
   <button data-page="market">Market Tour</button>
   <div class="more" id="moreNav">
    <button class="more-toggle" id="moreToggle">More <span>⌄</span></button>
    <div class="more-menu">
     <button data-page="offers">Special Offers</button>
     <button data-page="redeem">Redeem Offer</button>
     <button data-page="gallery">Gallery</button>
     <button data-page="reviews">Reviews</button>
     <button data-page="contact">Contact</button>
    </div>
   </div>
   <button class="book-btn" data-page="booking">Book Now</button>
  </nav>
 </div>
</header>
<main>
 <iframe id="pageFrame" title="Taste of Bali page" loading="eager"></iframe>
</main>
<iframe id="footerFrame" title="Taste of Bali footer" loading="lazy"></iframe>
<script>
const PAGES = [{"id": "home", "label": "Home", "html": "\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"en\"\u003e\n\u003chead\u003e\n\u003cmeta charset=\"UTF-8\"\u003e\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\u003e\n\u003ctitle\u003eTaste of Bali | Cooking Class\u003c/title\u003e\n\n\u003cstyle\u003e\n@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600\u0026family=Playfair+Display:wght@400;500;600\u0026display=swap');\n\n:root {\n  --green: #173f35;\n  --sage: #879e94;\n  --cream: #ffffff;\n  --coral: #c97962;\n  --ink: #000000;\n}\n\n* { box-sizing: border-box; }\n\nhtml { scroll-behavior: smooth; }\n\nbody {\n  margin: 0;\n  padding: 0;\n  font-family: 'DM Sans', Arial, sans-serif;\n  color: var(--ink);\n  background: #ffffff;\n  font-size: 14px;\n  line-height: 1.6;\n}\n\nimg {\n  display: block;\n  width: 100%;\n  height: 100%;\n  object-fit: cover;\n}\n\na { text-decoration: none; }\n\n.wrap {\n  width: min(1120px, 90%);\n  margin: auto;\n}\n\n.btn {\n  display: inline-block;\n  border: 0;\n  background: var(--coral);\n  color: #ffffff;\n  padding: 11px 17px;\n  font-size: 11px;\n  cursor: pointer;\n  text-align: center;\n  transition: .2s;\n}\n\n.btn:hover {\n  filter: brightness(.92);\n  transform: translateY(-1px);\n}\n\n.btn.dark {\n  background: var(--green);\n  color: #ffffff;\n}\n\nsection {\n  padding: 62px 0;\n  background: #ffffff;\n  color: #000000;\n}\n\n#about { padding-top: 40px; }\n\n.intro {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 55px;\n  align-items: center;\n}\n\n.intro-photo {\n  height: 300px;\n  overflow: hidden;\n  border-radius: 3px;\n}\n\n.eyebrow {\n  text-transform: uppercase;\n  letter-spacing: 2px;\n  font-size: 10px;\n  margin-bottom: 12px;\n  color: #000000;\n}\n\nh1, h2, h3, .dish-name {\n  font-family: 'Playfair Display', Georgia, serif;\n  font-weight: 500;\n  color: #000000;\n}\n\nh2 {\n  font-size: clamp(26px, 3vw, 36px);\n  line-height: 1.2;\n  margin: 0 0 10px;\n}\n\nh3 {\n  font-size: 19px;\n  margin: 0 0 7px;\n}\n\n.lead {\n  font-size: 13px;\n  color: #000000;\n}\n\n.small-note {\n  font-size: 11px;\n  color: #000000;\n  margin-top: 18px;\n}\n\n.small-note span {\n  color: var(--coral);\n  margin-right: 8px;\n}\n\n.cream {\n  background: #ffffff;\n  color: #000000;\n}\n\n.section-head {\n  text-align: center;\n  margin: 0 auto 32px;\n  max-width: 600px;\n}\n\n.section-head p {\n  font-size: 12px;\n  color: #000000;\n  margin-top: 8px;\n}\n\n.classes {\n  display: grid;\n  grid-template-columns: repeat(3, 1fr);\n  gap: 22px;\n}\n\n.class-card {\n  background: #ffffff;\n  color: #000000;\n  padding-bottom: 18px;\n  border-radius: 3px;\n  overflow: hidden;\n  box-shadow: 0 3px 14px #00000010;\n}\n\n.class-card img { height: 185px; }\n\n.card-body { padding: 15px 17px 0; }\n\n.card-body h3 { color: #000000; }\n\n.card-body p {\n  font-size: 11px;\n  color: #000000;\n  min-height: 48px;\n}\n\n.price-row {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  font-size: 11px;\n  margin-bottom: 14px;\n  gap: 10px;\n  color: #000000;\n}\n\n.price {\n  color: var(--coral);\n  font-weight: 600;\n}\n\n.duration { color: #000000; }\n\n.card-body .btn {\n  display: block;\n  width: 100%;\n  padding: 10px;\n}\n\n.included {\n  display: grid;\n  grid-template-columns: repeat(3, 1fr);\n  gap: 18px;\n}\n\n.include-item {\n  background: #ffffff;\n  color: #000000;\n  padding: 18px;\n  display: flex;\n  gap: 13px;\n  align-items: flex-start;\n  border: 1px solid #eeeeee;\n  border-radius: 3px;\n}\n\n.include-icon {\n  flex: 0 0 30px;\n  width: 30px;\n  height: 30px;\n  border-radius: 50%;\n  background: #ffffff;\n  border: 1px solid #eeeeee;\n  display: grid;\n  place-items: center;\n  color: #000000;\n}\n\n.include-item strong {\n  font-family: 'Playfair Display', serif;\n  font-weight: 500;\n  font-size: 16px;\n  color: #000000;\n  display: block;\n  margin-bottom: 4px;\n}\n\n.include-item p {\n  font-size: 11px;\n  color: #000000;\n  margin: 0;\n}\n\n/* UPDATED SIGNATURE DISHES */\n.dishes-section {\n  width: 100%;\n  padding: 48px 5.4%;\n  background: #f7f2e8;\n  color: #183f35;\n}\n\n.dishes-heading {\n  text-align: center;\n  margin: 0 auto 32px;\n  max-width: 600px;\n}\n\n.dishes-heading h2 {\n  margin: 0 0 8px;\n  font-family: 'Playfair Display', serif;\n  font-size: clamp(26px, 3vw, 36px);\n  line-height: 1.2;\n  font-weight: 600;\n  color: #183f35;\n}\n\n.dishes-heading p {\n  margin: 0;\n  font-size: 12px;\n  color: #4f4a42;\n}\n\n.dishes-grid {\n  display: grid;\n  grid-template-columns: repeat(3, minmax(0, 1fr));\n  gap: 20px;\n  max-width: 1120px;\n  margin: 0 auto;\n}\n\n.dish-card {\n  background: #ffffff;\n  border-radius: 5px;\n  overflow: hidden;\n  min-width: 0;\n  box-shadow: 0 3px 14px #0000000a;\n}\n\n.dish-card img {\n  display: block;\n  width: 100%;\n  height: 180px;\n  object-fit: cover;\n}\n\n.dish-info {\n  padding: 13px 15px 15px;\n  min-height: 90px;\n}\n\n.dish-info h3 {\n  margin: 0 0 5px;\n  font-family: 'Playfair Display', serif;\n  font-size: 17px;\n  line-height: 1.35;\n  font-weight: 500;\n  color: #183f35;\n}\n\n.dish-info p {\n  margin: 0;\n  font-size: 11px;\n  line-height: 1.6;\n  color: #514d46;\n}\n\n.offers {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 22px;\n}\n\n.offer {\n  background: #ffffff;\n  color: #000000;\n  padding: 24px 26px;\n  border: 1px solid #eeeeee;\n  border-radius: 3px;\n}\n\n.offer h3 {\n  font-size: 21px;\n  color: #000000;\n}\n\n.offer p {\n  font-size: 12px;\n  color: #000000;\n}\n\n.gallery {\n  display: grid;\n  grid-template-columns: repeat(3, 1fr);\n  gap: 18px;\n}\n\n.gallery img {\n  height: 210px;\n  border-radius: 3px;\n  transition: transform .3s;\n}\n\n.gallery img:hover { transform: scale(1.015); }\n\n.reviews {\n  display: grid;\n  grid-template-columns: repeat(3, 1fr);\n  gap: 20px;\n}\n\n.review {\n  background: #ffffff;\n  color: #000000;\n  padding: 22px;\n  border: 1px solid #eeeeee;\n  border-radius: 3px;\n}\n\n.stars {\n  color: var(--coral);\n  letter-spacing: 2px;\n  margin-bottom: 10px;\n}\n\n.review p {\n  font-size: 12px;\n  color: #000000;\n}\n\n.review strong {\n  font-family: 'Playfair Display', serif;\n  font-size: 15px;\n  font-weight: 500;\n  color: #000000;\n}\n\n.review small {\n  display: block;\n  font-size: 10px;\n  color: #000000;\n}\n\n.cta {\n  background: #ffffff;\n  color: #000000;\n  text-align: center;\n  padding: 65px 20px;\n}\n\n.cta h2 {\n  font-size: clamp(29px, 4vw, 42px);\n  color: #000000;\n}\n\n.cta p {\n  font-size: 12px;\n  color: #000000;\n  margin: 12px 0 22px;\n}\n\n/* TABLET */\n@media (max-width: 760px) {\n  section { padding: 48px 0; }\n\n  #about { padding-top: 30px; }\n\n  .intro {\n    grid-template-columns: 1fr;\n    gap: 25px;\n  }\n\n  .intro-photo { height: 250px; }\n\n  .classes,\n  .gallery,\n  .reviews,\n  .included {\n    grid-template-columns: repeat(2, 1fr);\n  }\n\n  .dishes-section { padding: 40px 4%; }\n\n  .dishes-grid {\n    grid-template-columns: repeat(2, minmax(0, 1fr));\n    gap: 15px;\n  }\n\n  .class-card img { height: 155px; }\n\n  .dish-card img { height: 155px; }\n\n  .dish-info { min-height: 90px; }\n\n  .dishes-heading h2 { font-size: 26px; }\n\n  .gallery img { height: 170px; }\n}\n\n/* MOBILE */\n@media (max-width: 480px) {\n  .classes,\n  .gallery,\n  .reviews,\n  .included,\n  .offers {\n    grid-template-columns: 1fr;\n  }\n\n  .dishes-section { padding: 35px 5%; }\n\n  .dishes-grid {\n    grid-template-columns: 1fr;\n    gap: 18px;\n  }\n\n  .class-card img { height: 220px; }\n\n  .dish-card img { height: 210px; }\n\n  .dish-info {\n    padding: 14px 15px 16px;\n    min-height: auto;\n  }\n\n  .dish-info h3 { font-size: 18px; }\n\n  .dish-info p { font-size: 12px; }\n\n  .gallery img { height: 230px; }\n\n  .section-head { margin-bottom: 25px; }\n}\n\u003c/style\u003e\n\u003c/head\u003e\n\n\u003cbody\u003e\n\u003cmain\u003e\n\n\u003c!-- ABOUT SECTION --\u003e\n\u003csection id=\"about\"\u003e\n  \u003cdiv class=\"wrap intro\"\u003e\n    \u003cdiv class=\"intro-photo\"\u003e\n      \u003cimg\n        src=\"https://drive.google.com/thumbnail?id=1y8l3zjTGv0ani1sGeTzhUutRxLAE5_dD\u0026sz=w800\"\n        alt=\"Traditional Balinese spices\"\n        loading=\"lazy\"\u003e\n    \u003c/div\u003e\n\n    \u003cdiv\u003e\n      \u003cp class=\"eyebrow\"\u003eOur Story\u003c/p\u003e\n      \u003ch2\u003eA Taste of Bali, Made by You\u003c/h2\u003e\n      \u003cp class=\"lead\"\u003e\n        Balinese cuisine is a beautiful aromatic celebration of\n        fresh herbs, roots, spices, and complex spice blends.\n        Our cooking school offers a bridge to this culinary\n        heritage. Guided by native chefs, you\u2019ll learn the\n        traditional methods of Balinese food preparation in a\n        communal bamboo kitchen surrounded by lush tropical greenery.\n      \u003c/p\u003e\n      \u003cp class=\"small-note\"\u003e\n        \u003cspan\u003e\u2667\u003c/span\u003e\n        Learn traditional Balinese cooking techniques\n      \u003c/p\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\u003c/section\u003e\n\n\u003c!-- COOKING CLASSES --\u003e\n\u003csection class=\"cream\" id=\"classes\"\u003e\n  \u003cdiv class=\"wrap\"\u003e\n    \u003cdiv class=\"section-head\"\u003e\n      \u003ch2\u003eOur Cooking Classes\u003c/h2\u003e\n      \u003cp\u003eChoose the perfect hands-on culinary journey in Ubud\u003c/p\u003e\n    \u003c/div\u003e\n\n    \u003cdiv class=\"classes\"\u003e\n      \u003carticle class=\"class-card\"\u003e\n        \u003cimg\n          src=\"https://drive.google.com/thumbnail?id=1I9G1gwONafikZlIZhLMVzMk7E6KzmpUF\u0026sz=w800\"\n          alt=\"Balinese Cooking Class\"\n          loading=\"lazy\"\u003e\n        \u003cdiv class=\"card-body\"\u003e\n          \u003ch3\u003eBalinese Cooking Class\u003c/h3\u003e\n          \u003cp\u003eLearn traditional dishes in an energetic, sensory-rich morning of exploration and creation.\u003c/p\u003e\n          \u003cdiv class=\"price-row\"\u003e\n            \u003cspan class=\"price\"\u003e$45 / person\u003c/span\u003e\n            \u003cspan class=\"duration\"\u003e3 Hours\u003c/span\u003e\n          \u003c/div\u003e\n          \u003ca class=\"btn dark\"\n             href=\"https://sites.google.com/view/tasteofbali/booking-now\"\n             target=\"_blank\" rel=\"noopener noreferrer\"\u003eBook Now\u003c/a\u003e\n        \u003c/div\u003e\n      \u003c/article\u003e\n\n      \u003carticle class=\"class-card\"\u003e\n        \u003cimg\n          src=\"https://drive.google.com/thumbnail?id=1jc8Fr6gxgkGOBTYxOrxWKkeasZTXBHcV\u0026sz=w800\"\n          alt=\"Cooking and Market Tour\"\n          loading=\"lazy\"\u003e\n        \u003cdiv class=\"card-body\"\u003e\n          \u003ch3\u003eCooking \u0026amp; Market Tour\u003c/h3\u003e\n          \u003cp\u003eVisit a local spice market, select fresh ingredients, then cook together in a traditional kitchen.\u003c/p\u003e\n          \u003cdiv class=\"price-row\"\u003e\n            \u003cspan class=\"price\"\u003e$55 / person\u003c/span\u003e\n            \u003cspan class=\"duration\"\u003e4 Hours\u003c/span\u003e\n          \u003c/div\u003e\n          \u003ca class=\"btn dark\"\n             href=\"https://sites.google.com/view/tasteofbali/our-class/market-tour\"\n             target=\"_blank\" rel=\"noopener noreferrer\"\u003eBook Now\u003c/a\u003e\n        \u003c/div\u003e\n      \u003c/article\u003e\n\n      \u003carticle class=\"class-card\"\u003e\n        \u003cimg\n          src=\"https://drive.google.com/thumbnail?id=1zP7kFdJfOXvgFguG9mMP2WVzHNZeJkSZ\u0026sz=w800\"\n          alt=\"Private Cooking Experience\"\n          loading=\"lazy\"\u003e\n        \u003cdiv class=\"card-body\"\u003e\n          \u003ch3\u003ePrivate Experience\u003c/h3\u003e\n          \u003cp\u003eEnjoy a customized session with your own private instructor in an exclusive, intimate setting.\u003c/p\u003e\n          \u003cdiv class=\"price-row\"\u003e\n            \u003cspan class=\"price\"\u003e$120 / person\u003c/span\u003e\n            \u003cspan class=\"duration\"\u003e3 Hours\u003c/span\u003e\n          \u003c/div\u003e\n          \u003ca class=\"btn dark\"\n             href=\"https://sites.google.com/view/tasteofbali/booking-now\"\n             target=\"_blank\" rel=\"noopener noreferrer\"\u003eBook Now\u003c/a\u003e\n        \u003c/div\u003e\n      \u003c/article\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\u003c/section\u003e\n\n\u003c!-- WHAT'S INCLUDED --\u003e\n\u003csection id=\"included\"\u003e\n  \u003cdiv class=\"wrap\"\u003e\n    \u003cdiv class=\"section-head\"\u003e\n      \u003ch2\u003eWhat's Included\u003c/h2\u003e\n      \u003cp\u003eWe take care of every detail so you can focus on cooking\u003c/p\u003e\n    \u003c/div\u003e\n\n    \u003cdiv class=\"included\"\u003e\n      \u003cdiv class=\"include-item\"\u003e\n        \u003cdiv class=\"include-icon\"\u003e\u273f\u003c/div\u003e\n        \u003cdiv\u003e\n          \u003cstrong\u003eCooking Apron\u003c/strong\u003e\n          \u003cp\u003eComfortable kitchen apron provided during the workshop.\u003c/p\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n\n      \u003cdiv class=\"include-item\"\u003e\n        \u003cdiv class=\"include-icon\"\u003e\u2667\u003c/div\u003e\n        \u003cdiv\u003e\n          \u003cstrong\u003eFresh Ingredients\u003c/strong\u003e\n          \u003cp\u003eFresh local ingredients and spices selected for your class.\u003c/p\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n\n      \u003cdiv class=\"include-item\"\u003e\n        \u003cdiv class=\"include-icon\"\u003e\u2659\u003c/div\u003e\n        \u003cdiv\u003e\n          \u003cstrong\u003eExperienced Chef\u003c/strong\u003e\n          \u003cp\u003eLearn authentic techniques from a local cooking instructor.\u003c/p\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n\n      \u003cdiv class=\"include-item\"\u003e\n        \u003cdiv class=\"include-icon\"\u003e\u274b\u003c/div\u003e\n        \u003cdiv\u003e\n          \u003cstrong\u003eWelcome Drink \u0026amp; Snack\u003c/strong\u003e\n          \u003cp\u003eEnjoy refreshments and traditional Balinese snacks.\u003c/p\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n\n      \u003cdiv class=\"include-item\"\u003e\n        \u003cdiv class=\"include-icon\"\u003e\u25a4\u003c/div\u003e\n        \u003cdiv\u003e\n          \u003cstrong\u003eRecipe Booklet\u003c/strong\u003e\n          \u003cp\u003eStep-by-step recipes to recreate the dishes at home.\u003c/p\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n\n      \u003cdiv class=\"include-item\"\u003e\n        \u003cdiv class=\"include-icon\"\u003e\u25ce\u003c/div\u003e\n        \u003cdiv\u003e\n          \u003cstrong\u003eCooking Equipment\u003c/strong\u003e\n          \u003cp\u003eCooking tools and equipment provided during the class.\u003c/p\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\u003c/section\u003e\n\n\u003c!-- UPDATED SIGNATURE DISHES --\u003e\n\u003csection class=\"dishes-section\" id=\"dishes\"\u003e\n  \u003cdiv class=\"dishes-heading\"\u003e\n    \u003ch2\u003eOur Signature Dishes\u003c/h2\u003e\n    \u003cp\u003eDiscover the authentic flavors of traditional Balinese cuisine\u003c/p\u003e\n  \u003c/div\u003e\n\n  \u003cdiv class=\"dishes-grid\"\u003e\n\n    \u003carticle class=\"dish-card\"\u003e\n      \u003cimg\n        src=\"https://drive.google.com/thumbnail?id=1oapm_bSS_2a5FpWjIpVBZmyX16DnGYvK\u0026sz=w1000\"\n        alt=\"Bebek Betutu\"\n        loading=\"lazy\"\u003e\n      \u003cdiv class=\"dish-info\"\u003e\n        \u003ch3\u003eBebek Betutu\u003c/h3\u003e\n        \u003cp\u003eSlow-cooked duck infused with traditional Balinese spices, herbs, and rich aromatic flavors.\u003c/p\u003e\n      \u003c/div\u003e\n    \u003c/article\u003e\n\n    \u003carticle class=\"dish-card\"\u003e\n      \u003cimg\n        src=\"https://drive.google.com/thumbnail?id=1U_E4gyHoEgzQBOx3zA9pduuLVTlImS7o\u0026sz=w1000\"\n        alt=\"Jaje Bali\"\n        loading=\"lazy\"\u003e\n      \u003cdiv class=\"dish-info\"\u003e\n        \u003ch3\u003eJaje Bali\u003c/h3\u003e\n        \u003cp\u003eTraditional Balinese sweets made with rice flour, sticky rice, coconut, and palm sugar.\u003c/p\u003e\n      \u003c/div\u003e\n    \u003c/article\u003e\n\n    \u003carticle class=\"dish-card\"\u003e\n      \u003cimg\n        src=\"https://drive.google.com/thumbnail?id=17SGEgkfNo3-Sva3OqsWyov2JvqFoNuWt\u0026sz=w1000\"\n        alt=\"Sambal Matah\"\n        loading=\"lazy\"\u003e\n      \u003cdiv class=\"dish-info\"\u003e\n        \u003ch3\u003eSambal Matah\u003c/h3\u003e\n        \u003cp\u003eA fresh Balinese raw sambal combining shallots, lemongrass, chilies, lime, and aromatic coconut oil.\u003c/p\u003e\n      \u003c/div\u003e\n    \u003c/article\u003e\n\n    \u003carticle class=\"dish-card\"\u003e\n      \u003cimg\n        src=\"https://drive.google.com/thumbnail?id=1uSIqLKTwMQ1g6-ZSY-_oqdIOAMxnxeoU\u0026sz=w1000\"\n        alt=\"Nasi Goreng\"\n        loading=\"lazy\"\u003e\n      \u003cdiv class=\"dish-info\"\u003e\n        \u003ch3\u003eNasi Goreng\u003c/h3\u003e\n        \u003cp\u003eIndonesian fried rice tossed with fragrant spices and savory seasonings for a comforting, flavorful meal.\u003c/p\u003e\n      \u003c/div\u003e\n    \u003c/article\u003e\n\n    \u003carticle class=\"dish-card\"\u003e\n      \u003cimg\n        src=\"https://drive.google.com/thumbnail?id=1NVVNb6WX4G3b5R1yEb6DpADuIlIVDKTk\u0026sz=w1000\"\n        alt=\"Sate Lilit\"\n        loading=\"lazy\"\u003e\n      \u003cdiv class=\"dish-info\"\u003e\n        \u003ch3\u003eSate Lilit\u003c/h3\u003e\n        \u003cp\u003eSeasoned minced fish or meat blended with Balinese spices and wrapped around lemongrass or bamboo skewers.\u003c/p\u003e\n      \u003c/div\u003e\n    \u003c/article\u003e\n\n    \u003carticle class=\"dish-card\"\u003e\n      \u003cimg\n        src=\"https://drive.google.com/thumbnail?id=14hNcLF8Ct-rqP3PkGSgM0iWn1XzYO72K\u0026sz=w1000\"\n        alt=\"Lawar\"\n        loading=\"lazy\"\u003e\n      \u003cdiv class=\"dish-info\"\u003e\n        \u003ch3\u003eLawar\u003c/h3\u003e\n        \u003cp\u003eA traditional Balinese mixture of finely chopped vegetables, grated coconut, herbs, and rich local spices.\u003c/p\u003e\n      \u003c/div\u003e\n    \u003c/article\u003e\n\n  \u003c/div\u003e\n\u003c/section\u003e\n\n\u003c!-- SPECIAL OFFERS --\u003e\n\u003csection id=\"offers\"\u003e\n  \u003cdiv class=\"wrap\"\u003e\n    \u003cdiv class=\"section-head\"\u003e\n      \u003ch2\u003eSpecial Offers\u003c/h2\u003e\n      \u003cp\u003eReady to discover our exclusive cooking packages?\u003c/p\u003e\n    \u003c/div\u003e\n\n    \u003cdiv class=\"offers\"\u003e\n      \u003carticle class=\"offer\"\u003e\n        \u003ch3\u003eEarly Bird Discount\u003c/h3\u003e\n        \u003cp\u003e\n          Plan ahead and enjoy a special discount on your cooking\n          experience. Reserve at least 7 days in advance.\n        \u003c/p\u003e\n        \u003ca class=\"btn\"\n           href=\"https://sites.google.com/view/tasteofbali/special-offer/reedem-special-offers\"\n           target=\"_blank\" rel=\"noopener noreferrer\"\u003eClaim Offer\u003c/a\u003e\n      \u003c/article\u003e\n\n      \u003carticle class=\"offer\"\u003e\n        \u003ch3\u003eGroup Package\u003c/h3\u003e\n        \u003cp\u003e\n          Gather your friends and family for a memorable culinary\n          journey with our special group package.\n        \u003c/p\u003e\n        \u003ca class=\"btn\"\n           href=\"https://sites.google.com/view/tasteofbali/special-offer/reedem-special-offers\"\n           target=\"_blank\" rel=\"noopener noreferrer\"\u003eClaim Offer\u003c/a\u003e\n      \u003c/article\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\u003c/section\u003e\n\n\u003c!-- GALLERY --\u003e\n\u003csection class=\"cream\" id=\"gallery\"\u003e\n  \u003cdiv class=\"wrap\"\u003e\n    \u003cdiv class=\"section-head\"\u003e\n      \u003ch2\u003eMoments from Ubud\u003c/h2\u003e\n      \u003cp\u003eTake a visual stroll through our tropical cooking workshops\u003c/p\u003e\n    \u003c/div\u003e\n\n    \u003cdiv class=\"gallery\"\u003e\n      \u003cimg src=\"https://drive.google.com/thumbnail?id=12V4ygYt-Id-sXyDgI_wY6eUsDN4jp4oC\u0026sz=w800\" alt=\"Guests cooking together in Ubud\" loading=\"lazy\"\u003e\n      \u003cimg src=\"https://drive.google.com/thumbnail?id=1GyJw18uVDyBlJeIIHZhwkNmE3u0yJgWM\u0026sz=w800\" alt=\"Fresh herbs and ingredients\" loading=\"lazy\"\u003e\n      \u003cimg src=\"https://drive.google.com/thumbnail?id=1SWfxjIrf3Bk4YUnbgbvOkc9ll6XSj7sd\u0026sz=w800\" alt=\"Cooking over an open flame\" loading=\"lazy\"\u003e\n      \u003cimg src=\"https://drive.google.com/thumbnail?id=1hLiMCM4Hoc33KKdpEK7e4Y9-x_m6ZsCj\u0026sz=w800\" alt=\"Chef demonstrating Balinese cooking\" loading=\"lazy\"\u003e\n      \u003cimg src=\"https://drive.google.com/thumbnail?id=1xoV758RSsleJHmnrsu1jeVJrjuvrJab3\u0026sz=w800\" alt=\"Preparing fresh ingredients\" loading=\"lazy\"\u003e\n      \u003cimg src=\"https://drive.google.com/thumbnail?id=1z9r4seAis_vcZPLfmy2EajXVYo3AErAz\u0026sz=w800\" alt=\"A finished Balinese meal outdoors\" loading=\"lazy\"\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\u003c/section\u003e\n\n\u003c!-- REVIEWS --\u003e\n\u003csection id=\"reviews\"\u003e\n  \u003cdiv class=\"wrap\"\u003e\n    \u003cdiv class=\"section-head\"\u003e\n      \u003ch2\u003eWhat Our Guests Say\u003c/h2\u003e\n      \u003cp\u003eShared stories from travelers around the globe\u003c/p\u003e\n    \u003c/div\u003e\n\n    \u003cdiv class=\"reviews\"\u003e\n      \u003carticle class=\"review\"\u003e\n        \u003cdiv class=\"stars\"\u003e\u2605\u2605\u2605\u2605\u2605\u003c/div\u003e\n        \u003cp\u003e\n          \u201cThe highlight of our Ubud trip! The cooking experience\n          was fun, welcoming, and full of delicious flavors.\n          The market tour was unforgettable.\u201d\n        \u003c/p\u003e\n        \u003cstrong\u003eJessica Miller\u003c/strong\u003e\n        \u003csmall\u003eAustralia\u003c/small\u003e\n      \u003c/article\u003e\n\n      \u003carticle class=\"review\"\u003e\n        \u003cdiv class=\"stars\"\u003e\u2605\u2605\u2605\u2605\u2605\u003c/div\u003e\n        \u003cp\u003e\n          \u201cI learned the secrets of Balinese cooking and really\n          enjoyed discovering traditional recipes. Highly\n          recommended for food enthusiasts.\u201d\n        \u003c/p\u003e\n        \u003cstrong\u003eHiro Tanaka\u003c/strong\u003e\n        \u003csmall\u003eJapan\u003c/small\u003e\n      \u003c/article\u003e\n\n      \u003carticle class=\"review\"\u003e\n        \u003cdiv class=\"stars\"\u003e\u2605\u2605\u2605\u2605\u2605\u003c/div\u003e\n        \u003cp\u003e\n          \u201cA fantastic experience! The team made the class\n          memorable with warm hospitality, delicious food,\n          and authentic local flavors.\u201d\n        \u003c/p\u003e\n        \u003cstrong\u003eLisa Grayson\u003c/strong\u003e\n        \u003csmall\u003eUnited Kingdom\u003c/small\u003e\n      \u003c/article\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\u003c/section\u003e\n\n\u003c!-- CALL TO ACTION --\u003e\n\u003csection class=\"cta\" id=\"contact\"\u003e\n  \u003ch2\u003eCome Cook With Us\u003c/h2\u003e\n  \u003cp\u003e\n    Your Balinese culinary adventure awaits.\n    Reserve your spot today.\n  \u003c/p\u003e\n  \u003ca class=\"btn\"\n     href=\"https://sites.google.com/view/tasteofbali/booking-now\"\n     target=\"_blank\" rel=\"noopener noreferrer\"\u003eBook Your Class\u003c/a\u003e\n\u003c/section\u003e\n\n\u003c/main\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n\n2. About us\n\n"}, {"id": "about", "label": "About Us", "html": "\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"en\"\u003e\n\u003chead\u003e\n\u003cmeta charset=\"UTF-8\"\u003e\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\u003e\n\u003ctitle\u003eAbout Us | Taste of Bali\u003c/title\u003e\n\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\"\u003e\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400;500;600;700\u0026family=Manrope:wght@400;500;600;700\u0026display=swap\" rel=\"stylesheet\"\u003e\n\n\u003cstyle\u003e\n* {\n  box-sizing: border-box;\n  margin: 0;\n  padding: 0;\n}\n\nbody {\n  font-family: 'Manrope', sans-serif;\n  color: #183f35;\n  background: #ffffff;\n  line-height: 1.7;\n}\n\nimg {\n  display: block;\n  width: 100%;\n  object-fit: cover;\n}\n\nh1, h2, h3, h4 {\n  font-family: 'Bodoni Moda', serif;\n  font-weight: 600;\n  line-height: 1.3;\n}\n\n.container {\n  width: 89%;\n  max-width: 1200px;\n  margin: auto;\n}\n\n.section-heading {\n  text-align: center;\n  margin-bottom: 35px;\n}\n\n.section-heading h2 {\n  font-size: 30px;\n  margin-bottom: 5px;\n}\n\n.section-heading p {\n  color: #686868;\n  font-size: 14px;\n}\n\n/* OUR STORY */\n\n.story {\n  padding: 65px 0;\n  background: #fff;\n}\n\n.story-grid {\n  display: grid;\n  grid-template-columns: 1.15fr 1fr;\n  gap: 65px;\n  align-items: center;\n}\n\n.story-text h2 {\n  font-size: 29px;\n  margin-bottom: 17px;\n}\n\n.story-text p {\n  color: #555;\n  font-size: 13px;\n  line-height: 2;\n  margin-bottom: 13px;\n}\n\n.story-image {\n  height: 290px;\n  border-radius: 6px;\n}\n\n/* MEET OUR CHEFS */\n\n.chefs {\n  padding: 60px 0 65px;\n  background: #f7f2e8;\n}\n\n.chef-grid {\n  display: grid;\n  grid-template-columns: repeat(3, 1fr);\n  gap: 25px;\n}\n\n.chef-card {\n  background: white;\n  border-radius: 6px;\n  overflow: hidden;\n}\n\n.chef-card img {\n  height: 220px;\n}\n\n.chef-info {\n  padding: 16px 18px 19px;\n}\n\n.chef-info h3 {\n  font-size: 17px;\n  margin-bottom: 2px;\n}\n\n.chef-role {\n  color: #c8755d;\n  font-size: 10px;\n  text-transform: uppercase;\n  margin-bottom: 8px;\n  letter-spacing: .2px;\n}\n\n.chef-info p:last-child {\n  color: #555;\n  font-size: 12px;\n  line-height: 1.8;\n}\n\n/* CORE VALUES */\n\n.values {\n  padding: 65px 0 70px;\n  background: white;\n}\n\n.value-grid {\n  display: grid;\n  grid-template-columns: repeat(3, 1fr);\n  gap: 25px;\n}\n\n.value-card img {\n  height: 160px;\n  border-radius: 6px;\n  margin-bottom: 12px;\n}\n\n.value-card h3 {\n  font-size: 18px;\n  margin-bottom: 7px;\n}\n\n.value-card p {\n  color: #555;\n  font-size: 12px;\n  line-height: 1.8;\n}\n\n/* RESPONSIVE */\n\n@media (max-width: 768px) {\n  .container {\n    width: 90%;\n  }\n\n  .story {\n    padding: 45px 0;\n  }\n\n  .story-grid {\n    grid-template-columns: 1fr;\n    gap: 25px;\n  }\n\n  .story-text h2 {\n    font-size: 26px;\n  }\n\n  .story-image {\n    height: 260px;\n  }\n\n  .chef-grid,\n  .value-grid {\n    grid-template-columns: 1fr;\n    gap: 22px;\n  }\n\n  .chef-card img {\n    height: 250px;\n  }\n\n  .value-card img {\n    height: 220px;\n  }\n\n  .section-heading h2 {\n    font-size: 26px;\n  }\n}\n\u003c/style\u003e\n\u003c/head\u003e\n\n\u003cbody\u003e\n\n\u003c!-- OUR STORY --\u003e\n\u003csection class=\"story\"\u003e\n  \u003cdiv class=\"container story-grid\"\u003e\n\n    \u003cdiv class=\"story-text\"\u003e\n      \u003ch2\u003eGenerations of Balinese Taste\u003c/h2\u003e\n\n      \u003cp\u003e\n        Founded by a native family deeply rooted in Ubud's cultural\n        community, Taste of Bali began with a simple mission: to\n        preserve and share the intricate legacy of local Balinese\n        food. Over decades, secret recipes for spice blends and\n        slow-cooking duck were passed down strictly by word of mouth.\n      \u003c/p\u003e\n\n      \u003cp\u003e\n        In 2018, we opened our tropical bamboo doors to curious\n        travelers. To us, cooking is not merely about instructions\u2014it\n        is about community, spirituality, and our ancestral\n        \"Tri Hita Karana\" philosophy of living in harmony with nature\n        and humanity.\n      \u003c/p\u003e\n    \u003c/div\u003e\n\n    \u003cimg\n      class=\"story-image\"\n      src=\"https://drive.google.com/thumbnail?id=1r_lX7bBY4KrmfpzZlkiL8oM4lPMeg7or\u0026sz=w1200\"\n      alt=\"A Balinese family sharing traditional food\"\n      loading=\"lazy\"\u003e\n\n  \u003c/div\u003e\n\u003c/section\u003e\n\n\u003c!-- MEET OUR CHEFS --\u003e\n\u003csection class=\"chefs\"\u003e\n  \u003cdiv class=\"container\"\u003e\n\n    \u003cdiv class=\"section-heading\"\u003e\n      \u003ch2\u003eMeet Our Chefs\u003c/h2\u003e\n      \u003cp\u003eGuided by passion, experience, and local expertise\u003c/p\u003e\n    \u003c/div\u003e\n\n    \u003cdiv class=\"chef-grid\"\u003e\n\n      \u003carticle class=\"chef-card\"\u003e\n        \u003cimg\n          src=\"https://drive.google.com/thumbnail?id=1Uo4IpwM-jnmPSmVQ9FhMqZ4_bCKldGDR\u0026sz=w1000\"\n          alt=\"Chef Wayan\"\n          loading=\"lazy\"\u003e\n\n        \u003cdiv class=\"chef-info\"\u003e\n          \u003ch3\u003eChef Wayan\u003c/h3\u003e\n          \u003cp class=\"chef-role\"\u003eHead Chef \u0026amp; Founder\u003c/p\u003e\n          \u003cp\u003e\n            Chef Wayan has over 20 years of professional culinary\n            experience. His mastery of traditional Balinese spices\n            brings ancestral recipes to life.\n          \u003c/p\u003e\n        \u003c/div\u003e\n      \u003c/article\u003e\n\n      \u003carticle class=\"chef-card\"\u003e\n        \u003cimg\n          src=\"https://drive.google.com/thumbnail?id=1hWdS5dFdeKWG8nWSd8UAYtslDia2QMJj\u0026sz=w1000\"\n          alt=\"Chef Ketut\"\n          loading=\"lazy\"\u003e\n\n        \u003cdiv class=\"chef-info\"\u003e\n          \u003ch3\u003eChef Ketut\u003c/h3\u003e\n          \u003cp class=\"chef-role\"\u003ePastry \u0026amp; Dessert Specialist\u003c/p\u003e\n          \u003cp\u003e\n            An expert in raw Balinese sugars and sweet delicacies,\n            Chef Ketut creates the perfect local sweet treats\n            to complete every feast.\n          \u003c/p\u003e\n        \u003c/div\u003e\n      \u003c/article\u003e\n\n      \u003carticle class=\"chef-card\"\u003e\n        \u003cimg\n          src=\"https://drive.google.com/thumbnail?id=1xrGz1o_fVWyJxJQWa-RMgfN5xcHZXVEx\u0026sz=w1000\"\n          alt=\"Chef Made\"\n          loading=\"lazy\"\u003e\n\n        \u003cdiv class=\"chef-info\"\u003e\n          \u003ch3\u003eChef Made\u003c/h3\u003e\n          \u003cp class=\"chef-role\"\u003eMarket Guide \u0026amp; Spice Expert\u003c/p\u003e\n          \u003cp\u003e\n            With deep relationships across regional Ubud agriculture,\n            Chef Made leads sensory tours into local markets,\n            sharing spice identification tips.\n          \u003c/p\u003e\n        \u003c/div\u003e\n      \u003c/article\u003e\n\n    \u003c/div\u003e\n  \u003c/div\u003e\n\u003c/section\u003e\n\n\u003c!-- CORE VALUES --\u003e\n\u003csection class=\"values\"\u003e\n  \u003cdiv class=\"container\"\u003e\n\n    \u003cdiv class=\"section-heading\"\u003e\n      \u003ch2\u003eOur Core Values\u003c/h2\u003e\n      \u003cp\u003eThe guiding philosophies behind our Ubud culinary school\u003c/p\u003e\n    \u003c/div\u003e\n\n    \u003cdiv class=\"value-grid\"\u003e\n\n      \u003carticle class=\"value-card\"\u003e\n        \u003cimg\n          src=\"https://drive.google.com/thumbnail?id=17q_a4QKueXymhGqxh0JYyUn4NRr0egZG\u0026sz=w1000\"\n          alt=\"Traditional Balinese spices being prepared\"\n          loading=\"lazy\"\u003e\n\n        \u003ch3\u003eAuthenticity\u003c/h3\u003e\n        \u003cp\u003e\n          No diluted shortcuts. We teach you Balinese cooking\n          exactly how our grandmothers prepared it for generations.\n        \u003c/p\u003e\n      \u003c/article\u003e\n\n      \u003carticle class=\"value-card\"\u003e\n        \u003cimg\n          src=\"https://drive.google.com/thumbnail?id=1wp1SqKEojqYhzuoaHvBjF6vB5Bb6EObF\u0026sz=w1000\"\n          alt=\"Green rice terraces in Bali\"\n          loading=\"lazy\"\u003e\n\n        \u003ch3\u003eSustainability\u003c/h3\u003e\n        \u003cp\u003e\n          Our ingredients are carefully sourced from local Ubud\n          smallholder farmers, supporting local flora and communities.\n        \u003c/p\u003e\n      \u003c/article\u003e\n\n      \u003carticle class=\"value-card\"\u003e\n        \u003cimg\n          src=\"https://drive.google.com/thumbnail?id=1y8l3zjTGv0ani1sGeTzhUutRxLAE5_dD\u0026sz=w1000\"\n          alt=\"Visitors enjoying Balinese culture together\"\n          loading=\"lazy\"\u003e\n\n        \u003ch3\u003eCommunity\u003c/h3\u003e\n        \u003cp\u003e\n          We support micro-farming initiatives and share portions\n          of our booking profits with Ubud village families.\n        \u003c/p\u003e\n      \u003c/article\u003e\n\n    \u003c/div\u003e\n  \u003c/div\u003e\n\u003c/section\u003e\n\n\u003c/body\u003e\n\u003c/html\u003e\n\n3.Our Class\n"}, {"id": "classes", "label": "Our Classes", "html": "\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"en\"\u003e\n\u003chead\u003e\n\u003cmeta charset=\"UTF-8\"\u003e\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\u003e\n\u003ctitle\u003eOur Cooking Classes | Taste of Bali\u003c/title\u003e\n\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\"\u003e\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400;500;600;700\u0026family=Manrope:wght@400;500;600;700\u0026display=swap\" rel=\"stylesheet\"\u003e\n\n\u003cstyle\u003e\n* {\n  box-sizing: border-box;\n  margin: 0;\n  padding: 0;\n}\n\nbody {\n  font-family: 'Manrope', sans-serif;\n  color: #193f35;\n  background: #fff;\n  line-height: 1.7;\n}\n\nimg {\n  width: 100%;\n  display: block;\n  object-fit: cover;\n}\n\nh1, h2, h3, h4 {\n  font-family: 'Bodoni Moda', serif;\n  font-weight: 600;\n  line-height: 1.35;\n}\n\n.container {\n  width: 89%;\n  max-width: 1200px;\n  margin: auto;\n}\n\n.section-heading {\n  text-align: center;\n  margin-bottom: 35px;\n}\n\n.section-heading h2 {\n  font-size: 29px;\n  margin-bottom: 5px;\n}\n\n.section-heading p {\n  font-size: 13px;\n  color: #666;\n}\n\n/* CLASS PACKAGES */\n\n.class-section {\n  padding: 55px 0;\n  background: #fff;\n}\n\n.class-section.alt {\n  background: #f7f2e8;\n}\n\n.class-grid {\n  display: grid;\n  grid-template-columns: 1fr 1.08fr;\n  gap: 55px;\n  align-items: center;\n}\n\n.class-grid.reverse .class-image {\n  order: 2;\n}\n\n.class-grid.reverse .class-content {\n  order: 1;\n}\n\n.class-image {\n  height: 310px;\n  border-radius: 5px;\n}\n\n.class-content h2 {\n  font-size: 27px;\n  margin-bottom: 4px;\n}\n\n.price-line {\n  margin-bottom: 16px;\n  font-size: 13px;\n  color: #666;\n}\n\n.price {\n  font-size: 16px;\n  font-weight: 700;\n  color: #c8755d;\n}\n\n.duration {\n  margin-left: 9px;\n  font-size: 12px;\n}\n\n.class-content .description {\n  color: #555;\n  font-size: 12px;\n  line-height: 1.9;\n  margin-bottom: 12px;\n}\n\n.included-title {\n  font-family: 'Bodoni Moda', serif;\n  font-size: 14px;\n  margin-bottom: 4px;\n}\n\n.included-list {\n  padding-left: 18px;\n  color: #555;\n  font-size: 11px;\n  line-height: 1.9;\n  margin-bottom: 15px;\n}\n\n.book-button {\n  display: inline-block;\n  background: #c8755d;\n  color: #fff;\n  padding: 11px 20px;\n  border-radius: 3px;\n  text-decoration: none;\n  font-family: 'Manrope', sans-serif;\n  font-size: 11px;\n  font-weight: 700;\n  transition: background .2s;\n  cursor: pointer;\n}\n\n.book-button:hover {\n  background: #a95c47;\n}\n\n/* COMPARISON TABLE */\n\n.compare {\n  padding: 55px 0 65px;\n  background: #f7f2e8;\n}\n\n.table-wrapper {\n  overflow-x: auto;\n  border-radius: 5px;\n}\n\ntable {\n  width: 100%;\n  border-collapse: collapse;\n  background: white;\n  font-size: 12px;\n  min-width: 580px;\n}\n\nthead {\n  background: #173e33;\n  color: #fff;\n}\n\nth, td {\n  padding: 14px 12px;\n  text-align: center;\n  font-weight: 400;\n}\n\nth:first-child, td:first-child {\n  text-align: left;\n}\n\ntbody tr:nth-child(even) {\n  background: #f8f5ef;\n}\n\ntbody td:first-child {\n  font-weight: 600;\n  color: #25483d;\n}\n\n/* FAQ */\n\n.faq {\n  padding: 55px 0 65px;\n  background: #fff;\n}\n\n.faq .section-heading {\n  margin-bottom: 30px;\n}\n\n.faq-list {\n  max-width: 760px;\n  margin: auto;\n}\n\n.faq-item {\n  background: #f7f2e8;\n  border-radius: 5px;\n  padding: 16px 20px;\n  margin-bottom: 13px;\n}\n\n.faq-item h3 {\n  font-size: 15px;\n  margin-bottom: 5px;\n}\n\n.faq-item p {\n  color: #555;\n  font-size: 12px;\n  line-height: 1.8;\n}\n\n/* BOTTOM NAVIGATION */\n\n.bottom-navigation {\n  display: flex;\n  justify-content: center;\n  align-items: center;\n  flex-wrap: wrap;\n  gap: 12px;\n  padding: 25px 15px;\n  background: #173e33;\n}\n\n.nav-button {\n  display: inline-block;\n  padding: 10px 20px;\n  border: 1px solid #d8b878;\n  border-radius: 3px;\n  color: #f8f3ea;\n  font-family: 'Manrope', sans-serif;\n  font-size: 11px;\n  font-weight: 700;\n  text-decoration: none;\n  transition: all .2s ease;\n}\n\n.nav-button:hover {\n  background: #d8b878;\n  color: #173e33;\n}\n\n.nav-button.primary {\n  background: #c8755d;\n  border-color: #c8755d;\n  color: #fff;\n}\n\n.nav-button.primary:hover {\n  background: #a95c47;\n  border-color: #a95c47;\n}\n\n/* RESPONSIVE */\n\n@media (max-width: 768px) {\n  .container {\n    width: 90%;\n  }\n\n  .class-section {\n    padding: 38px 0;\n  }\n\n  .class-grid {\n    grid-template-columns: 1fr;\n    gap: 23px;\n  }\n\n  .class-grid.reverse .class-image,\n  .class-grid.reverse .class-content {\n    order: initial;\n  }\n\n  .class-image {\n    height: 260px;\n  }\n\n  .class-content h2 {\n    font-size: 25px;\n  }\n\n  .section-heading h2 {\n    font-size: 25px;\n  }\n\n  .bottom-navigation {\n    gap: 8px;\n  }\n\n  .nav-button {\n    padding: 10px 13px;\n  }\n}\n\u003c/style\u003e\n\u003c/head\u003e\n\n\u003cbody\u003e\n\n\u003c!-- CLASS 1: BALINESE COOKING CLASS --\u003e\n\u003csection class=\"class-section\" id=\"balinese-class\"\u003e\n  \u003cdiv class=\"container class-grid\"\u003e\n\n    \u003cimg\n      class=\"class-image\"\n      src=\"https://drive.google.com/thumbnail?id=1vzpV9Lnr1NWsD_Ib_r22VgA-LnkZCXku\u0026sz=w1200\"\n      alt=\"Guests learning traditional Balinese cooking\"\n      loading=\"lazy\"\u003e\n\n    \u003cdiv class=\"class-content\"\u003e\n      \u003ch2\u003eBalinese Cooking Class\u003c/h2\u003e\n\n      \u003cp class=\"price-line\"\u003e\n        \u003cspan class=\"price\"\u003e$45 / person\u003c/span\u003e\n        \u003cspan class=\"duration\"\u003e\u2022 4 Hours\u003c/span\u003e\n      \u003c/p\u003e\n\n      \u003cp class=\"description\"\u003e\n        Our signature hands-on workshop introduces you to the core\n        dynamics of authentic Balinese home cooking. Under the close\n        guidance of our resident chefs, you will chop, grind, and\n        prepare five traditional delicacies using our proprietary\n        ginger spice paste.\n      \u003c/p\u003e\n\n      \u003ch3 class=\"included-title\"\u003eWhat's Included:\u003c/h3\u003e\n      \u003cul class=\"included-list\"\u003e\n        \u003cli\u003eWelcome drink, lemongrass tea, and traditional sweet pastries\u003c/li\u003e\n        \u003cli\u003ePrinted family recipe booklet and beautiful certificate\u003c/li\u003e\n        \u003cli\u003eComplimentary round-trip hotel transfer within Ubud area\u003c/li\u003e\n      \u003c/ul\u003e\n\n      \u003ca class=\"book-button\"\n         href=\"https://sites.google.com/view/tasteofbali/booking-now\"\n         target=\"_blank\" rel=\"noopener noreferrer\"\u003e\n        Book This Class\n      \u003c/a\u003e\n    \u003c/div\u003e\n\n  \u003c/div\u003e\n\u003c/section\u003e\n\n\u003c!-- CLASS 2: COOKING CLASS \u0026 MARKET TOUR --\u003e\n\u003csection class=\"class-section alt\" id=\"market-tour\"\u003e\n  \u003cdiv class=\"container class-grid reverse\"\u003e\n\n    \u003cimg\n      class=\"class-image\"\n      src=\"https://drive.google.com/thumbnail?id=1j3uPhHSz1ZwytEhOu2FYx8sfNfcNV9hn\u0026sz=w1200\"\n      alt=\"Guests exploring fresh ingredients at a traditional Balinese market\"\n      loading=\"lazy\"\u003e\n\n    \u003cdiv class=\"class-content\"\u003e\n      \u003ch2\u003eCooking Class \u0026amp; Market Tour\u003c/h2\u003e\n\n      \u003cp class=\"price-line\"\u003e\n        \u003cspan class=\"price\"\u003e$65 / person\u003c/span\u003e\n        \u003cspan class=\"duration\"\u003e\u2022 6 Hours\u003c/span\u003e\n      \u003c/p\u003e\n\n      \u003cp class=\"description\"\u003e\n        Expand your culinary senses with our comprehensive market\n        tour. We begin in the cool morning at an authentic Ubud\n        traditional market. Select native fresh herbs, local\n        produce, and master spice identification before returning\n        to cook seven exquisite dishes.\n      \u003c/p\u003e\n\n      \u003ch3 class=\"included-title\"\u003eWhat's Included:\u003c/h3\u003e\n      \u003cul class=\"included-list\"\u003e\n        \u003cli\u003eEverything in the standard class package\u003c/li\u003e\n        \u003cli\u003eGuided market tour with spice and fruit tastings\u003c/li\u003e\n        \u003cli\u003eCook 2 additional traditional dishes (7 total)\u003c/li\u003e\n      \u003c/ul\u003e\n\n      \u003ca class=\"book-button\"\n         href=\"https://sites.google.com/view/tasteofbali/our-class/market-tour\"\n         target=\"_blank\" rel=\"noopener noreferrer\"\u003e\n        Explore Market Tour\n      \u003c/a\u003e\n    \u003c/div\u003e\n\n  \u003c/div\u003e\n\u003c/section\u003e\n\n\u003c!-- CLASS 3: PRIVATE COOKING EXPERIENCE --\u003e\n\u003csection class=\"class-section\" id=\"private-chef\"\u003e\n  \u003cdiv class=\"container class-grid\"\u003e\n\n    \u003cimg\n      class=\"class-image\"\n      src=\"https://drive.google.com/thumbnail?id=1a3EGc9x6eD6P8W_MGNe-nsR6vPA7sl7e\u0026sz=w1200\"\n      alt=\"Private Balinese cooking experience with a local chef\"\n      loading=\"lazy\"\u003e\n\n    \u003cdiv class=\"class-content\"\u003e\n      \u003ch2\u003ePrivate Cooking Experience\u003c/h2\u003e\n\n      \u003cp class=\"price-line\"\u003e\n        \u003cspan class=\"price\"\u003e$120 / person\u003c/span\u003e\n        \u003cspan class=\"duration\"\u003e\u2022 5 Hours\u003c/span\u003e\n      \u003c/p\u003e\n\n      \u003cp class=\"description\"\u003e\n        The ultimate luxury package designed for families, couples,\n        or culinary purists. Collaborate directly with Chef Wayan\n        to customize a gourmet five-course menu. Enjoy absolute\n        exclusivity inside our premium rainforest bamboo terrace\n        kitchen with dedicated service.\n      \u003c/p\u003e\n\n      \u003ch3 class=\"included-title\"\u003eWhat's Included:\u003c/h3\u003e\n      \u003cul class=\"included-list\"\u003e\n        \u003cli\u003eFully customized private menu with premium ingredients\u003c/li\u003e\n        \u003cli\u003eDedicated host, server, and master chef exclusively for you\u003c/li\u003e\n        \u003cli\u003ePremium round-trip luxury private car transfer\u003c/li\u003e\n      \u003c/ul\u003e\n\n      \u003ca class=\"book-button\"\n         href=\"https://sites.google.com/view/tasteofbali/booking-now\"\n         target=\"_blank\" rel=\"noopener noreferrer\"\u003e\n        Book This Class\n      \u003c/a\u003e\n    \u003c/div\u003e\n\n  \u003c/div\u003e\n\u003c/section\u003e\n\n\u003c!-- COMPARE PACKAGES --\u003e\n\u003csection class=\"compare\" id=\"compare\"\u003e\n  \u003cdiv class=\"container\"\u003e\n\n    \u003cdiv class=\"section-heading\"\u003e\n      \u003ch2\u003eCompare Packages\u003c/h2\u003e\n      \u003cp\u003eFind the best fit for your culinary wanderlust\u003c/p\u003e\n    \u003c/div\u003e\n\n    \u003cdiv class=\"table-wrapper\"\u003e\n      \u003ctable\u003e\n        \u003cthead\u003e\n          \u003ctr\u003e\n            \u003cth\u003eFeature\u003c/th\u003e\n            \u003cth\u003eStandard Class\u003c/th\u003e\n            \u003cth\u003eMarket \u0026amp; Class\u003c/th\u003e\n            \u003cth\u003ePrivate Experience\u003c/th\u003e\n          \u003c/tr\u003e\n        \u003c/thead\u003e\n\n        \u003ctbody\u003e\n          \u003ctr\u003e\n            \u003ctd\u003ePrice\u003c/td\u003e\n            \u003ctd\u003e$45\u003c/td\u003e\n            \u003ctd\u003e$65\u003c/td\u003e\n            \u003ctd\u003e$120\u003c/td\u003e\n          \u003c/tr\u003e\n\n          \u003ctr\u003e\n            \u003ctd\u003eDuration\u003c/td\u003e\n            \u003ctd\u003e4 Hours\u003c/td\u003e\n            \u003ctd\u003e6 Hours\u003c/td\u003e\n            \u003ctd\u003e5 Hours\u003c/td\u003e\n          \u003c/tr\u003e\n\n          \u003ctr\u003e\n            \u003ctd\u003eDishes Prepared\u003c/td\u003e\n            \u003ctd\u003e5 Dishes\u003c/td\u003e\n            \u003ctd\u003e7 Dishes\u003c/td\u003e\n            \u003ctd\u003eCustomizable\u003c/td\u003e\n          \u003c/tr\u003e\n\n          \u003ctr\u003e\n            \u003ctd\u003eMarket Tour Included\u003c/td\u003e\n            \u003ctd\u003eNo\u003c/td\u003e\n            \u003ctd\u003eYes\u003c/td\u003e\n            \u003ctd\u003eOptional\u003c/td\u003e\n          \u003c/tr\u003e\n\n          \u003ctr\u003e\n            \u003ctd\u003eExclusivity\u003c/td\u003e\n            \u003ctd\u003eGroup Studio\u003c/td\u003e\n            \u003ctd\u003eGroup Studio\u003c/td\u003e\n            \u003ctd\u003ePrivate Studio\u003c/td\u003e\n          \u003c/tr\u003e\n\n          \u003ctr\u003e\n            \u003ctd\u003eUbud Transfers\u003c/td\u003e\n            \u003ctd\u003eStandard Shuttle\u003c/td\u003e\n            \u003ctd\u003eStandard Shuttle\u003c/td\u003e\n            \u003ctd\u003eLuxury Private Car\u003c/td\u003e\n          \u003c/tr\u003e\n        \u003c/tbody\u003e\n      \u003c/table\u003e\n    \u003c/div\u003e\n\n  \u003c/div\u003e\n\u003c/section\u003e\n\n\u003c!-- FAQ --\u003e\n\u003csection class=\"faq\" id=\"faq\"\u003e\n  \u003cdiv class=\"container\"\u003e\n\n    \u003cdiv class=\"section-heading\"\u003e\n      \u003ch2\u003eFrequently Asked Questions\u003c/h2\u003e\n      \u003cp\u003eEverything you need to know before joining us\u003c/p\u003e\n    \u003c/div\u003e\n\n    \u003cdiv class=\"faq-list\"\u003e\n\n      \u003carticle class=\"faq-item\"\u003e\n        \u003ch3\u003eIs transport included in Ubud area?\u003c/h3\u003e\n        \u003cp\u003e\n          Yes! Complimentary round-trip hotel transfer is included\n          for all bookings in central Ubud.\n        \u003c/p\u003e\n      \u003c/article\u003e\n\n      \u003carticle class=\"faq-item\"\u003e\n        \u003ch3\u003eAre vegetarian and vegan options available?\u003c/h3\u003e\n        \u003cp\u003e\n          Absolutely. All Balinese dishes we cook can be seamlessly\n          customized to support vegetarian, vegan, and gluten-free\n          dietary requirements.\n        \u003c/p\u003e\n      \u003c/article\u003e\n\n      \u003carticle class=\"faq-item\"\u003e\n        \u003ch3\u003eWhat should I wear to the cooking class?\u003c/h3\u003e\n        \u003cp\u003e\n          We recommend light, comfortable, breathable tropical\n          clothing and sensible shoes for standing and walking\n          around the marketplace.\n        \u003c/p\u003e\n      \u003c/article\u003e\n\n      \u003carticle class=\"faq-item\"\u003e\n        \u003ch3\u003eIs the morning market tour crowded?\u003c/h3\u003e\n        \u003cp\u003e\n          The Ubud morning market is a lively local experience.\n          Our guides guide you safely, ensuring an authentic\n          and comfortable stroll.\n        \u003c/p\u003e\n      \u003c/article\u003e\n\n      \u003carticle class=\"faq-item\"\u003e\n        \u003ch3\u003eAre children allowed to join?\u003c/h3\u003e\n        \u003cp\u003e\n          Yes, children of all ages are welcome. Kids under 6\n          join free to observe and enjoy, while older children\n          love the hands-on fun.\n        \u003c/p\u003e\n      \u003c/article\u003e\n\n    \u003c/div\u003e\n  \u003c/div\u003e\n\u003c/section\u003e\n\n\u003c!-- BOOKING CTA --\u003e\n\u003csection class=\"class-section alt\" id=\"booking\"\u003e\n  \u003cdiv class=\"container\" style=\"text-align:center; padding:15px 0;\"\u003e\n    \u003ch2 style=\"font-size:30px; margin-bottom:10px;\"\u003e\n      Ready to Cook Like a Local?\n    \u003c/h2\u003e\n\n    \u003cp style=\"font-size:13px; color:#555; margin-bottom:20px;\"\u003e\n      Discover the authentic flavors of Bali with our local chefs.\n    \u003c/p\u003e\n\n    \u003ca class=\"book-button\"\n       href=\"https://sites.google.com/view/tasteofbali/booking-now\"\n       target=\"_blank\" rel=\"noopener noreferrer\"\u003e\n      Book Your Experience\n    \u003c/a\u003e\n  \u003c/div\u003e\n\u003c/section\u003e\n\n\u003c!-- NAVIGATION LINKS --\u003e\n\u003cnav class=\"bottom-navigation\" aria-label=\"Page navigation\"\u003e\n\n  \u003ca class=\"nav-button\"\n     href=\"https://sites.google.com/view/tasteofbali/home-page\"\n     target=\"_blank\" rel=\"noopener noreferrer\"\u003e\n    Home\n  \u003c/a\u003e\n\n  \u003ca class=\"nav-button\"\n     href=\"https://sites.google.com/view/tasteofbali/about-us\"\n     target=\"_blank\" rel=\"noopener noreferrer\"\u003e\n    About Us\n  \u003c/a\u003e\n\n  \u003ca class=\"nav-button primary\"\n     href=\"https://sites.google.com/view/tasteofbali/booking-now\"\n     target=\"_blank\" rel=\"noopener noreferrer\"\u003e\n    Booking Now\n  \u003c/a\u003e\n\n\u003c/nav\u003e\n\n\u003c/body\u003e\n\u003c/html\u003e\n\n4. Market Tour\n"}, {"id": "market", "label": "Market Tour", "html": "\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"en\"\u003e\n\u003chead\u003e\n\u003cmeta charset=\"UTF-8\"\u003e\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\u003e\n\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\"\u003e\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400;500;600;700\u0026family=Manrope:wght@400;500;600;700\u0026display=swap\" rel=\"stylesheet\"\u003e\n\n\u003cstyle\u003e\n* {\n  box-sizing: border-box;\n  margin: 0;\n  padding: 0;\n}\n\nhtml, body {\n  width: 100%;\n  background: transparent !important;\n}\n\nbody {\n  font-family: 'Manrope', sans-serif;\n  color: #193f35;\n  line-height: 1.7;\n}\n\nh1 {\n  font-family: 'Bodoni Moda', serif;\n  font-weight: 600;\n  line-height: 1.3;\n}\n\n.container {\n  width: 89%;\n  max-width: 1200px;\n  margin: auto;\n}\n\n.market-hero {\n  background: transparent !important;\n  color: #193f35;\n  padding: 30px 0;\n}\n\n.market-hero-grid {\n  display: grid;\n  grid-template-columns: 1.1fr 1fr;\n  gap: 40px;\n  align-items: center;\n}\n\n.market-hero-content .tag {\n  font-size: 10px;\n  text-transform: uppercase;\n  letter-spacing: 1.5px;\n  color: #c8755d;\n  margin-bottom: 12px;\n  display: block;\n}\n\n.market-hero-content h1 {\n  font-size: clamp(30px, 4vw, 44px);\n  margin-bottom: 15px;\n  color: #193f35;\n}\n\n.market-hero-content p {\n  font-size: 13px;\n  color: #555;\n  line-height: 1.9;\n  margin-bottom: 25px;\n}\n\n.market-hero-buttons {\n  display: flex;\n  gap: 12px;\n  flex-wrap: wrap;\n}\n\n.btn-primary {\n  display: inline-block;\n  background: #c8755d;\n  color: #fff;\n  padding: 12px 22px;\n  border-radius: 4px;\n  font-size: 11px;\n  font-weight: 700;\n  text-decoration: none;\n  transition: background .2s;\n}\n\n.btn-primary:hover {\n  background: #a95c47;\n}\n\n.btn-outline {\n  display: inline-block;\n  background: transparent;\n  color: #193f35;\n  border: 1px solid #193f35;\n  padding: 12px 22px;\n  border-radius: 4px;\n  font-size: 11px;\n  font-weight: 600;\n  text-decoration: none;\n  transition: all .2s;\n}\n\n.btn-outline:hover {\n  background: rgba(25,63,53,.06);\n}\n\n.market-hero-img img {\n  display: block;\n  width: 100%;\n  height: 340px;\n  object-fit: cover;\n  border-radius: 6px;\n}\n\n@media (max-width: 768px) {\n  .container {\n    width: 90%;\n  }\n\n  .market-hero {\n    padding: 20px 0;\n  }\n\n  .market-hero-grid {\n    grid-template-columns: 1fr;\n    gap: 24px;\n  }\n\n  .market-hero-content h1 {\n    font-size: 32px;\n  }\n\n  .market-hero-img img {\n    height: 260px;\n  }\n}\n\u003c/style\u003e\n\u003c/head\u003e\n\n\u003cbody\u003e\n\n\u003csection class=\"market-hero\" id=\"top\"\u003e\n  \u003cdiv class=\"container\"\u003e\n    \u003cdiv class=\"market-hero-grid\"\u003e\n\n      \u003cdiv class=\"market-hero-content\"\u003e\n        \u003cspan class=\"tag\"\u003eAuthentic Culinary Experience\u003c/span\u003e\n\n        \u003ch1\u003eA Morning at the Market. A Taste of Bali.\u003c/h1\u003e\n\n        \u003cp\u003e\n          Immerse your senses in vibrant spice markets. Source fresh\n          local ingredients with your chef and learn your dishes step\n          by step in our bamboo kitchen oasis.\n        \u003c/p\u003e\n\n        \u003cdiv class=\"market-hero-buttons\"\u003e\n          \u003ca href=\"https://sites.google.com/view/tasteofbali/booking-now\"\n             class=\"btn-primary\"\n             target=\"_blank\"\n             rel=\"noopener noreferrer\"\u003e\n            Book Morning Tour\n          \u003c/a\u003e\n\n          \u003ca href=\"https://sites.google.com/view/tasteofbali/our-class/market-tour\"\n             class=\"btn-outline\"\n             target=\"_blank\"\n             rel=\"noopener noreferrer\"\u003e\n            Explore Itinerary\n          \u003c/a\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n\n      \u003cdiv class=\"market-hero-img\"\u003e\n        \u003cimg\n          src=\"https://drive.google.com/thumbnail?id=1j3uPhHSz1ZwytEhOu2FYx8sfNfcNV9hn\u0026sz=w1200\"\n          alt=\"A Morning at the Market\"\u003e\n      \u003c/div\u003e\n\n    \u003c/div\u003e\n  \u003c/div\u003e\n\u003c/section\u003e\n\n\u003c/body\u003e\n\u003c/html\u003e\n\n5. special offers\n"}, {"id": "offers", "label": "Special Offers", "html": "\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"en\"\u003e\n\u003chead\u003e\n\u003cmeta charset=\"UTF-8\"\u003e\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\u003e\n\u003ctitle\u003eSpecial Offers | Taste of Bali\u003c/title\u003e\n\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\"\u003e\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400;500;600;700\u0026family=Manrope:wght@400;500;600;700\u0026display=swap\" rel=\"stylesheet\"\u003e\n\n\u003cstyle\u003e\n*{box-sizing:border-box;margin:0;padding:0}\n\nbody{\n  font-family:'Manrope',sans-serif;\n  color:#193f35;\n  background:#f7f2e8;\n  line-height:1.7\n}\n\nh1,h2,h3,h4{\n  font-family:'Bodoni Moda',serif;\n  font-weight:600;\n  line-height:1.35\n}\n\nimg{display:block;width:100%;object-fit:cover}\n.container{width:89%;max-width:1200px;margin:auto}\n\n/* OFFERS */\n.offers{\n  padding:40px 0 55px;\n  background:linear-gradient(to bottom,#fff 0,#fff 165px,#f7f2e8 165px,#f7f2e8 100%)\n}\n\n.offer-grid{\n  display:grid;\n  grid-template-columns:repeat(2,minmax(0,1fr));\n  gap:40px 28px\n}\n\n.offer-card{min-width:0}\n\n.offer-card img{\n  height:220px;\n  border-radius:6px 6px 0 0\n}\n\n.offer-content{padding:18px 20px 0}\n\n.offer-title-row{\n  display:flex;\n  align-items:center;\n  justify-content:space-between;\n  gap:12px;\n  margin-bottom:12px\n}\n\n.offer-title-row h2{font-size:22px}\n\n.badge{\n  background:#c8755d;\n  color:#fff;\n  border-radius:3px;\n  padding:5px 9px;\n  font-size:10px;\n  font-weight:700;\n  white-space:nowrap\n}\n\n.offer-description{\n  font-size:12px;\n  color:#555;\n  line-height:1.9;\n  margin-bottom:12px\n}\n\n.validity{font-size:11px;color:#333;margin-bottom:4px}\n\n.terms{\n  font-size:10px;\n  color:#777;\n  line-height:1.8;\n  margin-bottom:13px\n}\n\n.book-button{\n  display:block;\n  width:100%;\n  text-align:center;\n  background:#173e33;\n  color:#fff;\n  text-decoration:none;\n  padding:13px 15px;\n  border-radius:3px;\n  font-size:11px;\n  font-weight:700;\n  transition:background .2s\n}\n\n.book-button:hover{background:#285b4c}\n\n/* HOW TO REDEEM */\n.redeem{padding:30px 0 65px;background:#f7f2e8}\n\n.section-heading{text-align:center;margin-bottom:35px}\n.section-heading h2{font-size:30px;margin-bottom:6px}\n.section-heading p{font-size:13px;color:#666}\n\n.steps{\n  display:grid;\n  grid-template-columns:repeat(3,minmax(0,1fr));\n  gap:25px\n}\n\n.step-card{background:#fff;padding:26px 24px;border-radius:6px}\n\n.step-number{\n  font-family:'Bodoni Moda',serif;\n  color:#c8755d;\n  font-size:29px;\n  font-weight:700;\n  margin-bottom:8px\n}\n\n.step-card h3{font-size:18px;margin-bottom:9px}\n.step-card p{font-size:12px;color:#555;line-height:1.9}\n\n/* BOTTOM NAVIGATION */\n.bottom-navigation{\n  display:flex;\n  justify-content:center;\n  align-items:center;\n  flex-wrap:wrap;\n  gap:12px;\n  padding:25px 15px;\n  background:#f8f3ea;\n  border-top:1px solid #e8dfd0\n}\n\n.nav-button{\n  display:inline-block;\n  padding:10px 20px;\n  border:1px solid #173e33;\n  border-radius:3px;\n  color:#173e33;\n  font-family:'Manrope',sans-serif;\n  font-size:11px;\n  font-weight:700;\n  text-decoration:none;\n  transition:all .2s ease\n}\n\n.nav-button:hover{\n  background:#173e33;\n  color:#fff\n}\n\n.nav-button.primary{\n  background:#c8755d;\n  border-color:#c8755d;\n  color:#fff\n}\n\n.nav-button.primary:hover{\n  background:#a95c47;\n  border-color:#a95c47\n}\n\n/* RESPONSIVE */\n@media(max-width:768px){\n  .container{width:90%}\n  .offers{\n    padding:30px 0 40px;\n    background:linear-gradient(to bottom,#fff 0,#fff 100px,#f7f2e8 100px,#f7f2e8 100%)\n  }\n  .offer-grid{grid-template-columns:1fr;gap:32px}\n  .offer-card img{height:250px}\n  .offer-content{padding:16px 8px 0}\n  .offer-title-row h2{font-size:21px}\n  .steps{grid-template-columns:1fr;gap:16px}\n  .step-card{padding:23px}\n  .section-heading h2{font-size:26px}\n  .bottom-navigation{gap:8px}\n  .nav-button{padding:10px 13px}\n}\n\n@media(max-width:450px){\n  .offer-card img{height:210px}\n  .offer-title-row h2{font-size:19px}\n}\n\u003c/style\u003e\n\u003c/head\u003e\n\n\u003cbody\u003e\n\n\u003c!-- SPECIAL OFFER CARDS --\u003e\n\u003csection class=\"offers\" id=\"special-offers\"\u003e\n  \u003cdiv class=\"container\"\u003e\n    \u003cdiv class=\"offer-grid\"\u003e\n\n      \u003c!-- EARLY BIRD --\u003e\n      \u003carticle class=\"offer-card\" id=\"early-bird\"\u003e\n        \u003cimg\n          src=\"https://drive.google.com/thumbnail?id=10C514M62iuTH-2OQNFccOg1OorSBOWmK\u0026sz=w1200\"\n          alt=\"Fresh ingredients prepared for a Balinese cooking class\"\n          loading=\"lazy\"\u003e\n\n        \u003cdiv class=\"offer-content\"\u003e\n          \u003cdiv class=\"offer-title-row\"\u003e\n            \u003ch2\u003eEarly Bird Discount\u003c/h2\u003e\n            \u003cspan class=\"badge\"\u003e15% OFF\u003c/span\u003e\n          \u003c/div\u003e\n\n          \u003cp class=\"offer-description\"\u003e\n            Reserve your culinary class at least 7 days ahead to\n            unlock an instant 15% rate reduction on any standard\n            or market experience.\n          \u003c/p\u003e\n\n          \u003cp class=\"validity\"\u003e\u003cstrong\u003eValidity:\u003c/strong\u003e Booking 7+ days in advance\u003c/p\u003e\n          \u003cp class=\"terms\"\u003eTerms: Applies to Balinese Cooking Class and Cooking Class \u0026amp; Market Tour.\u003c/p\u003e\n\n          \u003ca class=\"book-button\"\n             href=\"https://sites.google.com/view/tasteofbali/booking-now\"\n             target=\"_blank\" rel=\"noopener noreferrer\"\u003e\n            Book with This Offer\n          \u003c/a\u003e\n        \u003c/div\u003e\n      \u003c/article\u003e\n\n      \u003c!-- GROUP DISCOUNT --\u003e\n      \u003carticle class=\"offer-card\" id=\"group-discount\"\u003e\n        \u003cimg\n          src=\"https://drive.google.com/thumbnail?id=1H8_NP3quKR5xr1kSH-KR_SBGRr_4qGOa\u0026sz=w1200\"\n          alt=\"Friends enjoying a group cooking experience in Bali\"\n          loading=\"lazy\"\u003e\n\n        \u003cdiv class=\"offer-content\"\u003e\n          \u003cdiv class=\"offer-title-row\"\u003e\n            \u003ch2\u003eGroup Discount\u003c/h2\u003e\n            \u003cspan class=\"badge\"\u003e20% OFF\u003c/span\u003e\n          \u003c/div\u003e\n\n          \u003cp class=\"offer-description\"\u003e\n            Gather your closest food lovers. Parties of 4 or more\n            receive 20% off our signature hands-on market-tour package.\n          \u003c/p\u003e\n\n          \u003cp class=\"validity\"\u003e\u003cstrong\u003eValidity:\u003c/strong\u003e Valid for groups of 4+ guests\u003c/p\u003e\n          \u003cp class=\"terms\"\u003eTerms: Must book under a single reservation name. Cannot be combined with other offers.\u003c/p\u003e\n\n          \u003ca class=\"book-button\"\n             href=\"https://sites.google.com/view/tasteofbali/booking-now\"\n             target=\"_blank\" rel=\"noopener noreferrer\"\u003e\n            Book with This Offer\n          \u003c/a\u003e\n        \u003c/div\u003e\n      \u003c/article\u003e\n\n      \u003c!-- HONEYMOON --\u003e\n      \u003carticle class=\"offer-card\" id=\"honeymoon\"\u003e\n        \u003cimg\n          src=\"https://drive.google.com/thumbnail?id=1OX4e8rCIGzuFgWovvWwvtpM1P1CRo42Z\u0026sz=w1200\"\n          alt=\"Romantic private dining experience surrounded by Bali's nature\"\n          loading=\"lazy\"\u003e\n\n        \u003cdiv class=\"offer-content\"\u003e\n          \u003cdiv class=\"offer-title-row\"\u003e\n            \u003ch2\u003eHoneymoon Package\u003c/h2\u003e\n            \u003cspan class=\"badge\"\u003eSPECIAL RATE\u003c/span\u003e\n          \u003c/div\u003e\n\n          \u003cp class=\"offer-description\"\u003e\n            An ultra-romantic couples cooking class. Includes\n            personalized guided kitchen workspace, private chef,\n            and an exquisite candlelight romantic setup.\n          \u003c/p\u003e\n\n          \u003cp class=\"validity\"\u003e\u003cstrong\u003eValidity:\u003c/strong\u003e $180 for 2 guests\u003c/p\u003e\n          \u003cp class=\"terms\"\u003eTerms: Includes premium raw chocolate dessert workshop and non-alcoholic sparkling mocktail.\u003c/p\u003e\n\n          \u003ca class=\"book-button\"\n             href=\"https://sites.google.com/view/tasteofbali/booking-now\"\n             target=\"_blank\" rel=\"noopener noreferrer\"\u003e\n            Book with This Offer\n          \u003c/a\u003e\n        \u003c/div\u003e\n      \u003c/article\u003e\n\n      \u003c!-- RAINY SEASON --\u003e\n      \u003carticle class=\"offer-card\" id=\"rainy-season\"\u003e\n        \u003cimg\n          src=\"https://drive.google.com/thumbnail?id=1ie9c7LyZgv6dnnNNSo03VtqJ_4t7dpbk\u0026sz=w1200\"\n          alt=\"Tropical bamboo retreat surrounded by lush greenery in Bali\"\n          loading=\"lazy\"\u003e\n\n        \u003cdiv class=\"offer-content\"\u003e\n          \u003cdiv class=\"offer-title-row\"\u003e\n            \u003ch2\u003eRainy Season Special\u003c/h2\u003e\n            \u003cspan class=\"badge\"\u003e25% OFF\u003c/span\u003e\n          \u003c/div\u003e\n\n          \u003cp class=\"offer-description\"\u003e\n            Unwind during Bali's serene rainy season with cozy\n            open-air tropical cooking workshops. Book from\n            November to March to save 25%.\n          \u003c/p\u003e\n\n          \u003cp class=\"validity\"\u003e\u003cstrong\u003eValidity:\u003c/strong\u003e Travel periods: Nov 1 \u2013 Mar 31\u003c/p\u003e\n          \u003cp class=\"terms\"\u003eTerms: Applies only to online bookings. Not valid during peak Christmas holiday weeks.\u003c/p\u003e\n\n          \u003ca class=\"book-button\"\n             href=\"https://sites.google.com/view/tasteofbali/booking-now\"\n             target=\"_blank\" rel=\"noopener noreferrer\"\u003e\n            Book with This Offer\n          \u003c/a\u003e\n        \u003c/div\u003e\n      \u003c/article\u003e\n\n    \u003c/div\u003e\n  \u003c/div\u003e\n\u003c/section\u003e\n\n\u003c!-- HOW TO REDEEM --\u003e\n\u003csection class=\"redeem\" id=\"how-to-redeem\"\u003e\n  \u003cdiv class=\"container\"\u003e\n\n    \u003cdiv class=\"section-heading\"\u003e\n      \u003ch2\u003eHow to Redeem\u003c/h2\u003e\n      \u003cp\u003eThree simple steps to secure your special rate\u003c/p\u003e\n    \u003c/div\u003e\n\n    \u003cdiv class=\"steps\"\u003e\n      \u003carticle class=\"step-card\"\u003e\n        \u003cdiv class=\"step-number\"\u003e01\u003c/div\u003e\n        \u003ch3\u003eSelect Your Offer\u003c/h3\u003e\n        \u003cp\u003e\n          Browse our active special packages above and select\n          the perfect deal that matches your Ubud travel group size.\n        \u003c/p\u003e\n      \u003c/article\u003e\n\n      \u003carticle class=\"step-card\"\u003e\n        \u003cdiv class=\"step-number\"\u003e02\u003c/div\u003e\n        \u003ch3\u003eClick Book Offer\u003c/h3\u003e\n        \u003cp\u003e\n          Select the 'Book with This Offer' button.\n          You will be directed to reserve your experience.\n        \u003c/p\u003e\n      \u003c/article\u003e\n\n      \u003carticle class=\"step-card\"\u003e\n        \u003cdiv class=\"step-number\"\u003e03\u003c/div\u003e\n        \u003ch3\u003eConfirmation Email\u003c/h3\u003e\n        \u003cp\u003e\n          Complete your reservation with our team. We will\n          confirm availability, your selected offer, and\n          pickup details by email.\n        \u003c/p\u003e\n      \u003c/article\u003e\n    \u003c/div\u003e\n\n  \u003c/div\u003e\n\u003c/section\u003e\n\n6.Reedem Special Offers\n"}, {"id": "redeem", "label": "Redeem Offer", "html": "\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"en\"\u003e\n\u003chead\u003e\n\u003cmeta charset=\"UTF-8\"\u003e\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\u003e\n\u003ctitle\u003eRedeem Special Offers | Taste of Bali\u003c/title\u003e\n\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\"\u003e\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400;500;600;700\u0026family=Manrope:wght@400;500;600;700\u0026display=swap\" rel=\"stylesheet\"\u003e\n\n\u003cstyle\u003e\n*{box-sizing:border-box;margin:0;padding:0}\nhtml,body{width:100%;background:#fff!important;color:#000;font-family:'Manrope',sans-serif;line-height:1.7}\nh1,h2,h3,h4{font-family:'Bodoni Moda',serif;font-weight:600;line-height:1.35;color:#000}\np,label{color:#000}\nimg{display:block;width:100%;object-fit:cover}\n.container{width:89%;max-width:1200px;margin:auto}\n\n/* FORM AND SUMMARY */\n.redeem-booking-section{padding:50px 0;background:#fff}\n.redeem-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:35px;align-items:start}\n.form-card,.summary-card{background:#fff;padding:30px;border-radius:8px;border:1px solid #eee;box-shadow:0 4px 15px rgba(0,0,0,.03);min-width:0}\n.section-title{font-size:20px;margin-bottom:18px;padding-bottom:8px;border-bottom:1px solid #eee}\n.form-group{margin-bottom:16px}\n.form-row{display:grid;grid-template-columns:1fr 1fr;gap:15px}\n.form-group label{display:block;font-size:11px;font-weight:700;margin-bottom:6px}\n.form-control{width:100%;padding:11px 14px;background:#fff;border:1px solid #ddd;border-radius:4px;font-family:'Manrope',sans-serif;font-size:12px;color:#000}\n.form-control:focus{outline:none;border-color:#193f35}\n.promo-row{display:flex;gap:10px}\n.promo-btn{background:#193f35;color:#fff;border:none;padding:0 20px;border-radius:4px;font-size:11px;font-weight:700;cursor:pointer;transition:background .2s;flex-shrink:0}\n.promo-btn:hover{background:#285b4c}\n.notice-box{font-size:11px;background:#fff;padding:10px 12px;border-radius:4px;margin-top:15px;border:1px solid #ddd;display:flex;align-items:flex-start;gap:8px}\n.notice-box span{color:#c8755d}\n.notice-box.success{border-color:#a9c7ae}\n.notice-box.error{border-color:#d9a29a}\n.notice-box p{font-size:11px}\n\n/* SUMMARY */\n.summary-card h2{font-size:22px;margin-bottom:18px}\n.summary-row{display:flex;justify-content:space-between;gap:15px;font-size:12px;margin-bottom:12px}\n.summary-row span:last-child{font-weight:600;text-align:right}\n.summary-divider{border:none;border-top:1px solid #ddd;margin:16px 0}\n.total-row{display:flex;justify-content:space-between;gap:15px;font-size:14px;font-weight:700;margin-bottom:20px}\n.total-row span:last-child{color:#c8755d;font-size:22px;font-family:'Bodoni Moda',serif}\n.summary-description{font-size:11px;line-height:1.7;margin-bottom:20px}\n.whatsapp-btn{display:block;width:100%;text-align:center;background:#c8755d;color:#fff!important;text-decoration:none;padding:13px 15px;border-radius:4px;font-size:12px;font-weight:700;transition:background .2s}\n.whatsapp-btn:hover{background:#b0614b}\n\n/* OFFERS */\n.offers-section{padding:40px 0 60px;background:#fff}\n.section-heading{margin-bottom:30px}\n.section-heading .small-tag{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:#c8755d;margin-bottom:6px;display:block}\n.section-heading h2{font-size:28px;margin-bottom:5px}\n.section-heading p{font-size:12px}\n.offer-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:30px}\n.offer-card{background:#fff;border:1px solid #eee;border-radius:6px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.03);min-width:0}\n.offer-card img{height:220px}\n.offer-content{padding:20px}\n.offer-title-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}\n.offer-title-row h3{font-size:20px}\n.badge{background:#c8755d;color:#fff!important;border-radius:3px;padding:4px 8px;font-size:10px;font-weight:700;flex-shrink:0}\n.offer-desc{font-size:12px;line-height:1.8;margin-bottom:12px}\n.offer-validity{font-size:11px;margin-bottom:4px}\n.offer-terms{font-size:10px;line-height:1.7;margin-bottom:15px}\n.book-offer-btn{display:block;width:100%;text-align:center;background:#173e33;color:#fff!important;text-decoration:none;padding:11px;border-radius:4px;font-size:11px;font-weight:700;transition:background .2s}\n.book-offer-btn:hover{background:#285b4c}\n\n/* STEPS */\n.redeem-steps-section{padding:30px 0 60px;background:#fff}\n.steps-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:25px;margin-bottom:20px}\n.step-card{background:#fff;padding:26px 24px;border-radius:6px;border:1px solid #eee;box-shadow:0 4px 12px rgba(0,0,0,.03)}\n.step-number{font-family:'Bodoni Moda',serif;color:#c8755d;font-size:28px;font-weight:700;margin-bottom:8px}\n.step-card h3{font-size:17px;margin-bottom:8px}\n.step-card p{font-size:12px;line-height:1.9}\n.confirm-notice{font-size:11px;background:#fff;padding:12px 18px;border-radius:6px;border:1px solid #ddd}\n\n/* FAQ */\n.faq-section{padding:20px 0 60px;background:#fff}\n.faq-list{display:flex;flex-direction:column;gap:12px;margin-top:20px}\n.faq-item{background:#fff;border:1px solid #eee;padding:18px 22px;border-radius:6px;display:flex;justify-content:space-between;align-items:center;gap:15px;box-shadow:0 2px 8px rgba(0,0,0,.02);font-size:13px;font-weight:600;cursor:pointer}\n.faq-item span{color:#c8755d;font-size:18px;flex-shrink:0}\n.faq-answer{display:none;padding:0 22px 18px;font-size:12px;line-height:1.8;color:#444;border:1px solid #eee;border-top:0;border-radius:0 0 6px 6px}\n.faq-entry.open .faq-answer{display:block}\n.faq-entry.open .faq-item{border-radius:6px 6px 0 0}\n\n/* CTA */\n.cta-banner{background:#fff;padding:60px 20px;text-align:center;border-top:1px solid #eee}\n.cta-banner h2{font-size:32px;margin-bottom:10px}\n.cta-banner p{font-size:13px;margin-bottom:25px}\n.cta-buttons{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}\n.btn-primary,.btn-outline{display:inline-block;padding:12px 22px;border-radius:4px;font-size:11px;font-weight:700;text-decoration:none;transition:background .2s}\n.btn-primary{background:#c8755d;color:#fff!important}\n.btn-primary:hover{background:#b0614b}\n.btn-outline{background:#173e33;color:#fff!important;border:1px solid #173e33}\n.btn-outline:hover{background:#285b4c}\n\n/* BOTTOM NAV */\n.bottom-navigation{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:10px;padding:25px 15px;background:#f8f3ea;border-top:1px solid #e8dfd0}\n.nav-button{display:inline-block;padding:10px 16px;border:1px solid #173e33;border-radius:3px;color:#173e33;text-decoration:none;font-size:11px;font-weight:700;transition:all .2s}\n.nav-button:hover{background:#173e33;color:#fff}\n.nav-button.primary{background:#c8755d;border-color:#c8755d;color:#fff}\n.nav-button.primary:hover{background:#a95c47}\n\n@media(max-width:992px){\n  .redeem-grid,.offer-grid{grid-template-columns:1fr}\n  .steps-grid{grid-template-columns:1fr}\n}\n@media(max-width:768px){\n  .container{width:90%}\n  .form-card,.summary-card{padding:22px}\n  .form-row{grid-template-columns:1fr;gap:0}\n  .offer-card img{height:200px}\n  .section-heading h2{font-size:25px}\n  .cta-banner h2{font-size:27px}\n  .nav-button{padding:10px 12px}\n}\n@media(max-width:420px){\n  .promo-row{flex-direction:column}\n  .promo-btn{padding:12px}\n}\n\u003c/style\u003e\n\u003c/head\u003e\n\n\u003cbody\u003e\n\n\u003c!-- REDEEM FORM AND PRICE SUMMARY --\u003e\n\u003csection class=\"redeem-booking-section\"\u003e\n  \u003cdiv class=\"container\"\u003e\n    \u003cdiv class=\"redeem-grid\"\u003e\n\n      \u003cdiv class=\"form-card\"\u003e\n        \u003ch2 class=\"section-title\"\u003eChoose Your Offer \u0026amp; Apply Your Code\u003c/h2\u003e\n\n        \u003cdiv class=\"form-group\"\u003e\n          \u003clabel for=\"offer\"\u003eSelect Offer\u003c/label\u003e\n          \u003cselect id=\"offer\" class=\"form-control\"\u003e\n            \u
